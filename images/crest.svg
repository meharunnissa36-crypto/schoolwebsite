<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Luminous Gold Gradients -->
    <linearGradient id="richGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D1" />
      <stop offset="25%" stop-color="#F2D06B" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#FDF0A6" />
    </linearGradient>

    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6508" />
    </linearGradient>

    <linearGradient id="shieldNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#143464" />
      <stop offset="45%" stop-color="#0A2246" />
      <stop offset="100%" stop-color="#031024" />
    </linearGradient>

    <radialGradient id="crestGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="crestShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="200" cy="190" r="150" fill="url(#crestGlow)" />

  <!-- Laurel Wreath Left -->
  <g fill="url(#richGold)" filter="url(#crestShadow)">
    <path d="M 125 260 C 90 230, 75 175, 90 120 C 94 128, 104 142, 102 158 C 100 174, 110 208, 125 260 Z" />
    <!-- Leaflets Left -->
    <path d="M 85 125 C 68 120, 56 104, 62 94 C 73 98, 84 110, 85 125 Z" />
    <path d="M 78 158 C 58 154, 50 138, 56 128 C 68 132, 78 144, 78 158 Z" />
    <path d="M 78 195 C 58 195, 50 178, 58 168 C 70 174, 78 183, 78 195 Z" />
    <path d="M 86 232 C 68 236, 60 220, 68 206 C 80 214, 86 222, 86 232 Z" />
    <path d="M 104 268 C 86 274, 78 260, 86 246 C 98 252, 104 258, 104 268 Z" />
  </g>

  <!-- Laurel Wreath Right -->
  <g fill="url(#richGold)" filter="url(#crestShadow)">
    <path d="M 275 260 C 310 230, 325 175, 310 120 C 306 128, 296 142, 298 158 C 300 174, 290 208, 275 260 Z" />
    <!-- Leaflets Right -->
    <path d="M 315 125 C 332 120, 344 104, 338 94 C 327 98, 316 110, 315 125 Z" />
    <path d="M 322 158 C 342 154, 350 138, 344 128 C 332 132, 322 144, 322 158 Z" />
    <path d="M 322 195 C 342 195, 350 178, 342 168 C 330 174, 322 183, 322 195 Z" />
    <path d="M 314 232 C 332 236, 340 220, 332 206 C 320 214, 314 222, 314 232 Z" />
    <path d="M 296 268 C 314 274, 322 260, 314 246 C 302 252, 296 258, 296 268 Z" />
  </g>

  <!-- Main Shield -->
  <g filter="url(#crestShadow)">
    <!-- Heavy Gold Outer Shield Rim -->
    <path d="M 110 75 Q 200 60, 290 75 Q 302 195, 200 310 Q 98 195, 110 75 Z"
          fill="url(#richGold)" stroke="#694C08" stroke-width="1.5" />
    <!-- Inner Navy Shield Body -->
    <path d="M 118 84 Q 200 70, 282 84 Q 293 190, 200 298 Q 107 190, 118 84 Z"
          fill="url(#shieldNavy)" stroke="url(#goldStroke)" stroke-width="3" />
    <!-- Golden Inner Inset Border -->
    <path d="M 126 94 Q 200 82, 274 94 Q 284 185, 200 286 Q 116 185, 126 94 Z"
          fill="none" stroke="url(#richGold)" stroke-width="1.8" stroke-dasharray="4,2" />
  </g>

  <!-- Cross Dividers (Gold) -->
  <line x1="200" y1="84" x2="200" y2="296" stroke="url(#richGold)" stroke-width="2.5" />
  <line x1="120" y1="180" x2="280" y2="180" stroke="url(#richGold)" stroke-width="2.5" />

  <!-- Quadrant 1 (Top-Left): Open Book of Knowledge -->
  <g transform="translate(138, 108) scale(0.85)" filter="url(#crestShadow)">
    <path d="M 10 8 Q 28 3, 44 9 Q 60 3, 78 8 L 78 40 Q 60 35, 44 41 Q 28 35, 10 40 Z" 
          fill="#FFFDF0" stroke="url(#richGold)" stroke-width="2.5" />
    <line x1="44" y1="9" x2="44" y2="40" stroke="url(#richGold)" stroke-width="2.5" />
    <!-- Book lines -->
    <line x1="18" y1="18" x2="38" y2="19" stroke="#927116" stroke-width="2" />
    <line x1="18" y1="26" x2="38" y2="27" stroke="#927116" stroke-width="2" />
    <line x1="50" y1="19" x2="70" y2="18" stroke="#927116" stroke-width="2" />
    <line x1="50" y1="27" x2="70" y2="26" stroke="#927116" stroke-width="2" />
  </g>

  <!-- Quadrant 2 (Top-Right): Flaming Torch of Wisdom -->
  <g transform="translate(220, 105) scale(0.85)" filter="url(#crestShadow)">
    <!-- Radiant Flame -->
    <path d="M 24 2 C 28 10, 38 14, 30 24 C 38 18, 42 12, 36 2 C 30 7, 28 8, 24 2 Z" fill="#FF5722" />
    <path d="M 26 7 C 29 12, 35 15, 30 20 C 34 16, 35 13, 31 7 Z" fill="#FFD54F" />
    <!-- Golden Torch -->
    <path d="M 16 23 L 42 23 L 34 35 L 24 35 Z" fill="url(#richGold)" stroke="#7A5608" stroke-width="1.2" />
    <path d="M 26 35 L 32 35 L 30 52 L 28 52 Z" fill="url(#richGold)" stroke="#7A5608" stroke-width="1" />
  </g>

  <!-- Quadrant 3 (Bottom-Left): Equestrian Stallion (Horse) -->
  <g transform="translate(136, 195) scale(0.8)" fill="url(#richGold)" filter="url(#crestShadow)">
    <path d="M 32 10 C 35 4, 43 3, 47 7 C 49 10, 54 14, 52 19 C 46 23, 41 21, 39 26 C 37 31, 43 40, 48 48 L 39 49 C 36 43, 31 37, 28 32 C 25 37, 23 48, 19 51 L 14 49 C 19 42, 21 31, 23 25 C 19 23, 14 27, 12 31 L 8 29 C 10 20, 17 16, 25 16 C 27 13, 29 11, 32 10 Z" />
  </g>

  <!-- Quadrant 4 (Bottom-Right): 5-Point Star of Academic Distinction -->
  <g transform="translate(222, 198) scale(0.9)" fill="url(#richGold)" filter="url(#crestShadow)">
    <polygon points="25,4 30,17 44,17 33,25 37,38 25,30 13,38 17,25 6,17 20,17" 
             stroke="#927116" stroke-width="1.5" />
    <circle cx="25" cy="22" r="3.5" fill="#FFFDF0" />
  </g>

  <!-- Imperial Crown on Top -->
  <g transform="translate(148, 24) scale(1.05)" filter="url(#crestShadow)">
    <path d="M 5 38 L 15 12 L 35 26 L 50 3 L 65 26 L 85 12 L 95 38 Z" fill="url(#richGold)" stroke="#6F5008" stroke-width="1.5" />
    <circle cx="15" cy="9" r="4.5" fill="#FFF9C4" stroke="#D4AF37" stroke-width="1" />
    <circle cx="50" cy="1" r="5.5" fill="#FFF9C4" stroke="#D4AF37" stroke-width="1" />
    <circle cx="85" cy="9" r="4.5" fill="#FFF9C4" stroke="#D4AF37" stroke-width="1" />
    <!-- Crown Base Band -->
    <rect x="3" y="38" width="94" height="9" rx="3" fill="url(#richGold)" stroke="#6F5008" stroke-width="1.2" />
    <circle cx="20" cy="42.5" r="2.8" fill="#C62828" />
    <circle cx="50" cy="42.5" r="2.8" fill="#1565C0" />
    <circle cx="80" cy="42.5" r="2.8" fill="#C62828" />
  </g>

  <!-- Banner Ribbon Bottom -->
  <g filter="url(#crestShadow)">
    <!-- Ribbon Tails -->
    <path d="M 32 342 L 80 316 L 80 354 L 48 365 Z" fill="url(#richGold)" stroke="#7A5608" stroke-width="1.5" />
    <path d="M 368 342 L 320 316 L 320 354 L 352 365 Z" fill="url(#richGold)" stroke="#7A5608" stroke-width="1.5" />
    <!-- Ribbon Shadow Fold -->
    <path d="M 46 328 L 78 300 L 78 335 Z" fill="#5A3E05" />
    <path d="M 354 328 L 322 300 L 322 335 Z" fill="#5A3E05" />
    <!-- Main Banner Arc -->
    <path d="M 68 318 Q 200 295, 332 318 L 322 355 Q 200 332, 78 355 Z" 
          fill="url(#richGold)" stroke="#7A5608" stroke-width="2" />
    <!-- Banner Inner Seam -->
    <path d="M 74 324 Q 200 302, 326 324" fill="none" stroke="#7A5608" stroke-width="1" stroke-dasharray="3,2" />
    <path d="M 84 349 Q 200 327, 316 349" fill="none" stroke="#7A5608" stroke-width="1" stroke-dasharray="3,2" />
  </g>

  <!-- Banner Typography -->
  <text x="200" y="341" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-weight="900" font-size="14.8" fill="#0A1E3C" letter-spacing="2">
    BASHARAT H.S.S
  </text>
  <text x="200" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10.8" fill="#FCE183" letter-spacing="3.8">
    EST. 1988 • VIRTUS ET SCIENTIA
  </text>
</svg>
